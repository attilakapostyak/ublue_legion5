# Boxes created by `just box-create` / `just box-update`.
# Each section is a box; `image` must be built first by `just box-build`.
# Options: https://distrobox.it/usage/distrobox-assemble/

[fedora_main]
image=localhost/fedora_main:latest
# Local images can't be pulled from a registry
pull=false
# Recreate the box when it already exists
replace=true
nvidia=true
init=false
root=false
start_now=false
